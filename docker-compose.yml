# Tally Ho boat box — container stack.
# Only Open WebUI runs in a container on purpose: Ollama is deliberately
# NOT here. It runs on the VM host (direct GPU access) and Open WebUI
# reaches it through OLLAMA_BASE_URL, set in .env (host Tailscale IP).
services:
  openwebui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: openwebui
    restart: unless-stopped
    # Localhost-only: nginx is the only public front door.
    ports:
      - "127.0.0.1:3000:8080"
    environment:
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL}
      - WEBUI_SECRET_KEY=${WEBUI_SECRET_KEY}
    volumes:
      - openwebui-data:/app/backend/data

volumes:
  openwebui-data:
