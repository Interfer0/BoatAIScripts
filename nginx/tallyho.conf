# Tally Ho boat box — nginx front door (Hermes edition).
# Installed by install.sh to /etc/nginx/sites-available/tallyho.
# Hermes WebUI (port 8787, bound to the local network) on /,
# Notion mirror on /mirror/. nginx still talks to WebUI over
# loopback (127.0.0.1:8787), which WebUI trusts implicitly, so no
# proxy allowlist config is needed for this same-host setup.
# Direct LAN clients reach WebUI on :8787 and are protected by
# its password auth (mandatory when bound beyond loopback).
# WebUI streams over SSE, so proxy buffering is off and read timeouts
# are long.
server {
    listen 80 default_server;
    server_name _;

    client_max_body_size 50m;

    location / {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location /mirror/ {
        proxy_pass http://127.0.0.1:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
